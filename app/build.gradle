// app/build.gradle - Konfigurasi build modul DualLineStatusBar
// Target Android 15 (API 35), minimum Android 12 (API 31)

plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def keystoreFile = localProps.getProperty('KEYSTORE_FILE', '')

android {
    namespace 'com.dualline.statusbar'
    compileSdk 35

    signingConfigs {
        if (keystoreFile) {
            create("release") {
                storeFile = file(keystoreFile)
                storePassword = localProps.getProperty("KEYSTORE_PASSWORD", "")
                keyAlias = localProps.getProperty("KEY_ALIAS", "")
                keyPassword = localProps.getProperty("KEY_PASSWORD", "")
            }
        }
    }

    defaultConfig {
        applicationId 'com.dualline.statusbar'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName "1.1.0"

        // Nama modul untuk ditampilkan di LSPosed Manager
        resValue "string", "app_name", "DualLine StatusBar"
    }

    buildTypes {
        release {
            if (keystoreFile) signingConfig = signingConfigs.getByName("release")
            minifyEnabled false
            // Jangan obfuscate - bisa mempengaruhi hook
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // Packaging untuk menghindari konflik
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // Xposed API - wajib untuk modul LSPosed
    // 'compileOnly' agar tidak di-bundle ke APK (sudah tersedia di system)
    compileOnly 'de.robv.android.xposed:api:82'
    // Sources untuk IDE support (opsional tapi membantu development)
    // Gunakan 'api' hanya jika kamu membangun library, bukan app
    // Untuk app module, gunakan compileOnly
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // SettingsActivity memakai widget framework (android.widget), tanpa AndroidX.
}
